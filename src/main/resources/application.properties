spring.application.name=iopms

# Supabase connection. Supply via environment variables, e.g.:
#   DB_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
#   DB_USER=postgres
#   DB_PASSWORD=<supabase-db-password>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iopms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ddl-auto=update manages the schema for the MVP; schema-postgres.sql documents it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secret for signing JWTs. Must be at least 32 bytes; always override in production.
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-0123456789-abcdef}
