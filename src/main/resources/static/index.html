<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IOPMS — Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-box">
    <h1>Valen Labs — IOPMS</h1>
    <p class="muted">Intern Operations &amp; Performance Management System</p>
    <form id="login">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <p class="error" id="err"></p>
      <button style="width:100%;margin-top:10px">Log in</button>
    </form>
    <p class="muted">Default admin: admin@valenlabs.com / Admin@123</p>
  </div>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('err').textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Login failed');
        }
        const data = await res.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('name', data.name);
        location.href = data.role === 'ADMIN' ? '/admin.html' : '/intern.html';
      } catch (ex) {
        document.getElementById('err').textContent = ex.message;
      }
    });
  </script>
</body>
</html>
